argument_specs:
  main:
    short_description: Manage container images on target hosts
    options:
      containers_package_manifest:
        type: list
        elements: str
        required: false
        description: Packages to install on target host
      containers_deployment_manifest:
        type: list
        elements: dict
        required: true
        options:
          name:
            type: str
            required: true
            description: Short description
          registry:
            type: str
            default: ""
            description: Registry url with namespace
          registry_user:
            type: str
            default: ""
            description: Username to use to login to a registry
          registry_token:
            type: str
            default: ""
            description: Token to use to login to a registry
          image_name:
            type: str
            required: true
            description: Name of the container to deploy
          image_tag:
            type: str
            default: latest
            description: Image tag to pull from registry
          image_state:
            type: str
            required: true
            choices:
              - present
              - absent
            description: Expected state of container on target host
